<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title>Staff Login - Little Leaps Learning Center</title>
        <th:block th:insert="~{fragments/common/html-fragment-common-css :: commoncss}"></th:block>
        <link rel="stylesheet" th:href="@{/css/staff/login/lllc-staff-login-styles.css}"/>
    </head>
    <body>
        <div class="container-fluid p-0">
            <div class="top-fixed-container">

                <!-- Navigation Bar - Start -->
                <th:block th:insert="~{fragments/staff/common/html-navigation-staff-bar :: navigation-bar}"></th:block>
                <!-- Navigation Bar - End -->

                <!-- Mobile Sidebar - Start -->
                <th:block th:insert="~{fragments/staff/common/html-navigation-staff-sidebar :: mobile-sidebar}"></th:block>
                <!-- Mobile Sidebar - End -->
            </div>
        </div>

        <!-- TOP ERROR TOAST -->
        <div id="otp-toast-error" class="otp-toast-error"></div>

        <!-- Start Login Section -->
        <div class="login-section d-flex justify-content-center align-items-center">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-6 col-lg-5">
                        <div class="p-3 mb-3">
                            <div class="card">
                                <div class="card-header d-flex justify-content-center align-items-center text-center">
                                    <img src="https://res.cloudinary.com/dx8es7rbm/image/upload/v1785479530/uw3va3ixrtfyry1fxohi.png" class="login-img" alt="telatak">
                                </div>

                                <div class="card-body">
                                    <form>
                                        <h5 class="login-header mb-3 custom-header-color-black">Sign in to LLLC Portal</h5>
                                        <h5 class="login-sub-header mb-3 custom-header-color-black">Enter your username and password to access your account</h5>

                                        <!-- ERROR MESSAGE -->
                                        <span id="login-error" class="text-danger text-center mb-3"
                                              style="display: none; font-size: 12px; font-weight: bold; width: 100%;"></span>

                                        <div class="input-icon-wrapper mb-3">
                                            <div class="icon-box">
                                                <i class="bi bi-person-circle"></i>
                                            </div>
                                            <input type="text" class="form-control custom-input text-xsmall" id="staff-username" placeholder="Username" required>
                                        </div>

                                        <div class="input-icon-wrapper mb-3">
                                            <div class="icon-box">
                                                <i class="bi bi-key"></i>
                                            </div>
                                            <input type="password" class="form-control custom-input text-xsmall" id="staff-password" placeholder="Password" required>
                                        </div>

                                        <div class="pt-1 mb-4 d-flex justify-content-center align-items-center">
                                            <button type="submit"
                                                    class="btn btn-secondary d-flex justify-content-center align-items-center"
                                                    id="login-btn">

                                                <span id="login-spinner"
                                                      class="spinner-border spinner-border-sm mr-2"
                                                      style="display:none;"
                                                      role="status"
                                                      aria-hidden="true"></span>

                                                <span id="login-btn-text">Login</span>

                                            </button>
                                        </div>

                                        <div class="text-center custom-text-black text-xsmall">
                                            <p class="text-xxsmall"><a href="#!">Forgot Password</a></p>
                                        </div>
                                    </form>
                                </div>

                                <div class="card-footer">
                                    <div class="text-center text-xxxxsmall">
                                        &copy; <script>document.write(new Date().getFullYear());</script>
                                        <a href="https://littleleapslearningcenter.netlify.app/" class="text-decoration-none">Little Leaps Learning Center</a>. Powered by TechByte Solutions.
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
        <!-- End Login Section -->

        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-js :: staff-common-js}"></th:block>
        <script th:src="@{/js/staff/login/lllc-staff-login-scripts.js}" type="text/javascript"></script>
    </body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title>Leave Request - Little Leaps Learning Center</title>
        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-css :: staff-common-css}"></th:block>
        <link th:href="@{/css/staff/lllc-default-styles.css}" rel="stylesheet" type="text/css">
        <link th:href="@{/css/staff/clients/registry/add-sample/lllc-staff-add-client-styles.css}" rel="stylesheet" type="text/css">
        <style>
            textarea.form-control {
                height: 76px;
                resize: vertical;
                padding: 10px 12px;
            }

            .notes-wrapper {
                position: relative;
            }

            .char-counter {
                position: absolute;
                right: 8px;
                bottom: 5px;
                font-size: 10px;
                color: #7f8997;
            }

            /* icon positioning */
            .icon-left {
                position: absolute;
                left: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: rgb(0, 151, 157);
                font-size: 12px !important;
                pointer-events: none;
            }

            #available-balance,
            #requesting-leave,
            #returning-to-work-on,
            #leave-start-time,
            #leave-end-time {
                padding-left: 36px;
            }

            .form-label {
                font-size: 12px;
            }

            .form-control,
            .form-select {
                font-size: 11px !important;
            }

            .field-error {
                font-size: 11px;
            }
        </style>
    </head>
    <body class="container-fluid p-0" id="page-top">
        <div id="wrapper">
            <!-- Sidebar - Start -->
            <th:block th:insert="~{fragments/staff/common/html-fragment-staff-sidebar :: staff-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - End -->

            <div id="content-wrapper" class="d-flex flex-column">
                <div id="content">

                    <!-- Main Navigation Bar - Start -->
                    <th:block th:insert="~{fragments/staff/common/html-fragment-staff-main-navbar :: staff-common-main-navbar}"></th:block>
                    <!-- Main Navigation Bar - End -->

                    <div class="container-fluid">

                        <!-- Page Heading and Breadcrumbs - Start -->
                        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-breadcrumbs-no-greetings :: staff-breadcrumb-section(${pageTitle}, ${breadcrumbs})}"></th:block>
                        <!-- Page Heading and Breadcrumbs - End -->

                        <!-- Employee Attendance - Start -->
<!--                        <th:block th:insert="~{fragments/staff/common-util/attendance/html-fragment-common-staff-employee-attendance-->
<!--                                 :: common-staff-employee-attendance(${userInfo})}"></th:block>-->
                        <!-- Employee Attendance - End -->

                        <section class="default-card css-default-card">
                            <div class="css-default-card-header mb-2">
                                <div class="section-title">
                                    <div class="section-title-icon">
                                        <i class="fas fa-calendar-minus"></i>
                                    </div>
                                    <div>
                                        <h2>Request Time Off</h2>
                                        <p>View, manage, and track your time-off requests and leave records.</p>
                                    </div>
                                </div>

                                <button class="btn-glossy-teal-header d-flex justify-content-center align-items-center"
                                   id="submit-leave" style="text-decoration: none">
                                    <i class="fa-solid fa-paper-plane mr-2"></i> Submit Request
                                </button>
                            </div>
                            <div class="reports-table-wrapper">
                                <input type="hidden" id="employee-id" th:value="${userInfo['employeeId']}">
                                <div class="row px-2">
                                    <div class="col-12 col-md-8 mt-2 mb-2">
                                        <label for="leave-type" class="form-label">Leave Type<span class="required">*</span></label>
                                        <div class="select-wrapper">
                                            <select class="form-select required-field" id="leave-type">
                                                <option value="" selected disabled>Select leave type</option>
                                                <option value="VACATION">Vacation Leave</option>
                                                <option value="SICK">Sick Leave</option>
                                                <option value="EMERGENCY">Emergency Leave</option>
                                                <option value="MATERNITY">Maternity Leave</option>
                                                <option value="PATERNITY">Paternity Leave</option>
                                                <option value="UNPAID_PERSONAL">Unpaid Personal Leave</option>
                                                <option value="SSS_SICKNESS_AND_DISABILITY">SSS Sickness and Disability</option>
                                            </select>
                                        </div>
                                        <div class="field-error">Leave type is required.</div>
                                    </div>
                                    <div class="col-12 col-md-4 mt-2 mb-2">
                                        <label for="available-balance" class="form-label">Available Balance</label>
                                        <div class="date-input-wrapper">
                                            <input type="text" class="form-control" id="available-balance" placeholder="0 days" disabled>
                                            <i class="bi bi-calendar-event icon-left"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row px-2">
                                <div class="col-12 col-md-8 mt-2 mb-2">
                                    <label for="absence-duration" class="form-label">Absence Duration <span class="required">*</span></label>
                                    <div class="select-wrapper">
                                        <select class="form-select required-field" id="absence-duration">
                                            <option value="" selected disabled>Select an absence duration</option>
                                            <option value="FULL_DAY">Full Day</option>
                                            <option value="HALF_DAY_MORNING">Half Day - Morning</option>
                                            <option value="HALF_DAY_AFTERNOON">Half Day - Afternoon</option>
                                        </select>
                                    </div>
                                    <div class="field-error">Absence duration is required.</div>
                                </div>
                            </div>

                            <div class="row px-2">
                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="leave-start-date" class="form-label">Start Date<span class="required">*</span></label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control required-field" id="leave-start-date" placeholder="Select start date" required>
                                        <i class="bi bi-calendar-event calendar-icon"></i>
                                    </div>
                                    <div class="field-error"> Start date is required.</div>
                                </div>

                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="leave-end-date" class="form-label">End Date<span class="required">*</span></label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control required-field" id="leave-end-date" placeholder="Select end date" required>
                                        <i class="bi bi-calendar-event calendar-icon"></i>
                                    </div>
                                    <div class="field-error"> End date is required.</div>
                                </div>
                            </div>

                            <div class="row px-2" id="half-day-time-fields" style="display: none;">
                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="leave-start-time" class="form-label">Start Time</label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control" id="leave-start-time" disabled>
                                        <i class="bi bi-clock-fill icon-left"></i>
                                    </div>
                                </div>

                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="leave-end-time" class="form-label">End Time</label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control" id="leave-end-time" disabled>
                                        <i class="bi bi-clock-fill icon-left"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="row px-2">
                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="requesting-leave" class="form-label">Requesting</label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control" id="requesting-leave" placeholder="0 days" disabled>
                                        <i class="bi bi-clock-fill icon-left"></i>
                                    </div>
                                </div>

                                <div class="col-12 col-md-4 mt-2 mb-2">
                                    <label for="returning-to-work-on" class="form-label">Returning to Work On</label>
                                    <div class="date-input-wrapper">
                                        <input type="text" class="form-control" id="returning-to-work-on" disabled>
                                        <i class="bi bi-calendar-event icon-left"></i>
                                    </div>
                                </div>
                            </div>

                            <div class="row px-2">
                                <div class="col-12 col-md-12 mt-2 mb-2">
                                    <label for="leave-comment" class="form-label">Comment <span style="font-weight:400;">(Optional)</span></label>
                                    <div class="notes-wrapper">
                                        <textarea id="leave-comment" class="form-control" maxlength="500" placeholder="Add notes or special instructions..."></textarea>
                                        <span class="char-counter">
                                            <span id="charCount">0</span> / 500
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </div>
                </div>

                <!-- Footer - Start -->
                <th:block th:insert="~{fragments/staff/common/html-fragment-staff-footer :: staff-common-footer}"></th:block>
                <!-- Footer - End -->
            </div>
        </div>

        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-js :: staff-common-js}"></th:block>
        <script th:src="@{/js/staff/management/attendance/lllc-staff-common-employee-attendance-scripts.js}" type="text/javascript"></script>
        <script>
            $(document).ready(function () {
                initializeDatePicker("#leave-start-date", "Select start date");
                initializeDatePicker("#leave-end-date", "Select end date");

                /* Comment character counter */
                $("#leave-comment").on("input", function() {
                    $("#charCount").text($(this).val().length);
                });

                $("#leave-type").on("change", function() {
                    const leaveType = $(this).val();
                    const employeeId = $("#employee-id").val()
                    console.log("Selected leave type:", leaveType);

                    getAvailableLeaveBalance(employeeId, leaveType);
                });

                /* Absence Duration */
                $("#absence-duration").on("change", function() {
                    updateLeaveDetails();
                });

                /* Date fields */
                $("#leave-start-date, #leave-end-date").on("change input blur", function() {
                        setTimeout(function() {
                            updateLeaveDetails();
                        }, 100);
                    }
                );

                /* Submit Leave Request */
                $("#submit-leave").on("click", function() {
                    const leaveRequest = getLeaveRequestJson();

                    if (!leaveRequest) {
                        return;
                    }

                    console.log(leaveRequest);
                    saveLeaveRequest(leaveRequest)
                });

                /* Update Leave Details */
                function updateLeaveDetails() {
                    const duration = $("#absence-duration").val();
                    const startDateValue = $.trim($("#leave-start-date").val());
                    const endDateValue = $.trim($("#leave-end-date").val());

                    /* Half-day time fields */
                    const $timeFields = $("#half-day-time-fields");
                    const $startTime = $("#leave-start-time");
                    const $endTime = $("#leave-end-time");

                    if (duration === "HALF_DAY_MORNING") {
                        $timeFields.show();
                        $startTime.val("8:00 AM");
                        $endTime.val("12:00 PM");
                    } else if (duration === "HALF_DAY_AFTERNOON") {
                        $timeFields.show();
                        $startTime.val("1:00 PM");
                        $endTime.val("5:00 PM");
                    } else {
                        $timeFields.hide();
                        $startTime.val("8:00 AM");
                        $endTime.val("5:00 PM");
                    }

                    /* Clear calculated fields if incomplete */
                    if (!duration || !startDateValue || !endDateValue) {
                        $("#requesting-leave").val("");
                        $("#returning-to-work-on").val("");

                        return;
                    }

                    /* Parse dates */
                    const startDate = parseDate(startDateValue);
                    const endDate = parseDate(endDateValue);

                    if (!startDate || !endDate || endDate < startDate) {
                        $("#requesting-leave").val("");
                        $("#returning-to-work-on").val("");

                        return;
                    }

                    /* Calculate working days */
                    let workingDays = 0;
                    const currentDate = new Date(startDate);

                    while (currentDate <= endDate) {
                        if (!isWeekend(currentDate)) {
                            workingDays++;
                        }

                        currentDate.setDate(currentDate.getDate() + 1);
                    }

                    /* Requesting */
                    let requestingDays = workingDays;

                    if (duration === "HALF_DAY_MORNING" || duration === "HALF_DAY_AFTERNOON") {
                        requestingDays = workingDays * 0.5;
                    }

                    $("#requesting-leave").val(requestingDays + (requestingDays === 1 ? " day" : " days"));

                    /* Returning to Work On */
                    getNextWorkingDay(endDate).then(function(returnDate) {
                        console.log(returnDate);
                        $("#returning-to-work-on").val(formatDate(returnDate));
                    });
                }


                /* Format Leave Days */
                function formatLeaveDays(days) {
                    if (days === 1) {
                        return "1 day";
                    }

                    return days + " days";
                }

                function parseDate(value) {
                    if (!value) {
                        return null;
                    }

                    value = value.trim();

                    if (value.includes("-")) {
                        const parts = value.split("-");

                        if (parts.length !== 3) {
                            return null;
                        }

                        const year = parseInt(parts[0], 10);
                        const month = parseInt(parts[1], 10) - 1;
                        const day = parseInt(parts[2], 10);

                        if (isNaN(year) || isNaN(month) || isNaN(day)) {
                            return null;
                        }

                        const date = new Date(year, month, day);

                        if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
                            return null;
                        }

                        return date;
                    }

                    if (value.includes("/")) {
                        const parts = value.split("/");

                        if (parts.length !== 3) {
                            return null;
                        }

                        const month = parseInt(parts[0], 10) - 1;
                        const day = parseInt(parts[1], 10);
                        const year = parseInt(parts[2], 10);

                        if (isNaN(month) || isNaN(day) || isNaN(year)) {
                            return null;
                        }

                        const date = new Date(year, month, day);

                        if (date.getFullYear() !== year || date.getMonth() !== month || date.getDate() !== day) {
                            return null;
                        }
                        return date;
                    }
                    return null;
                }

                /* Check Weekend */
                function isWeekend(date) {
                    const day = date.getDay();
                    return day === 0 || day === 6;
                }

                /* Get Next Working Day */
                /* Get Next Working Day */
                function getNextWorkingDay(date) {
                    const nextDate = new Date(date);
                    nextDate.setDate(nextDate.getDate() + 1);

                    if (isWeekend(nextDate)) {
                        return getNextWorkingDay(nextDate);
                    }

                    const dateString = formatDateForApi(nextDate);

                    return isHoliday(dateString).then(function(holiday) {
                        if (holiday) {
                            return getNextWorkingDay(nextDate);
                        }

                        return nextDate;
                    });
                }

                /* Format Date for API */
                function formatDateForApi(date) {
                    const year = date.getFullYear();
                    const month = String(date.getMonth() + 1).padStart(2, "0");
                    const day = String(date.getDate()).padStart(2, "0");

                    return `${year}-${month}-${day}`;
                }

                /* Format Date */
                function formatDate(date) {
                    const month = String(date.getMonth() + 1).padStart(2, "0");
                    const day = String(date.getDate()).padStart(2, "0");
                    const year = date.getFullYear();

                    return `${month}/${day}/${year}`;
                }

                /* Required Field Validation */
                function validateRequiredFields() {
                    let valid = true;
                    let firstInvalid = null;

                    $(".required-field").each(function() {
                        const $field = $(this);
                        const value = $.trim(
                            $field.val() || ""
                        );

                        if (!value) {
                            $field.addClass("field-invalid");
                            $field
                                .closest("[class*='col-']")
                                .find(".field-error")
                                .first()
                                .addClass("show");

                            valid = false;

                            if (!firstInvalid) {
                                firstInvalid = $field;
                            }
                        }

                        else {
                            $field.removeClass("field-invalid");
                            $field
                                .closest("[class*='col-']")
                                .find(".field-error")
                                .first()
                                .removeClass("show");
                        }
                    });

                    if (firstInvalid) {
                        firstInvalid.trigger("focus");
                    }

                    return valid;
                }

                /* Remove Validation Error */
                $(".required-field").on("input change", function() {
                        const $field = $(this);
                        const value = $.trim($field.val() || "");

                        const $visibleField =
                            $field.hasClass("flatpickr-input") ?
                                $field.next(".form-control") :
                                $field;

                        const $error = $visibleField
                            .closest("[class*='col-']")
                            .find(".field-error")
                            .first();

                        if (value) {
                            $visibleField.removeClass("field-invalid");
                            $error.removeClass("show");
                        }
                    }
                );

                /* Convert time to LocalTime format */
                function toLocalTime(value) {
                    if (!value) {
                        return null;
                    }

                    value = value.trim();
                    const match = value.match(
                        /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
                    );

                    if (!match) {
                        return null;
                    }

                    let hour = parseInt(match[1], 10);
                    const minute = match[2];
                    const period = match[3].toUpperCase();

                    if (period === "AM") {
                        if (hour === 12) {
                            hour = 0;
                        }
                    } else if (period === "PM") {
                        if (hour !== 12) {
                            hour += 12;
                        }
                    }

                    return `${String(hour).padStart(2, "0")}:${minute}`;
                }


                /* Create Leave Request JSON */
                function getLeaveRequestJson() {
                    if (!validateRequiredFields()) {
                        return null;
                    }

                    const requestedDaysText = $("#requesting-leave").val() || "";
                    const returningToWork = $("#returning-to-work-on").val() || "";

                    const startDate = parseDate($("#leave-start-date").val());
                    const endDate = parseDate($("#leave-end-date").val());
                    const returningDate = parseDate(returningToWork);

                    return {
                        employeeId: $("#employee-id").val(),
                        leaveType: $("#leave-type").val(),
                        absenceDuration: $("#absence-duration").val(),
                        startDate: startDate ? formatDateForApi(startDate) : null,
                        endDate: endDate ? formatDateForApi(endDate) : null,
                        startTime: toLocalTime($("#leave-start-time").val()),
                        endTime: toLocalTime($("#leave-end-time").val()),
                        requestedDays: parseFloat(requestedDaysText),
                        returningToWorkOn: returningDate ? formatDateForApi(returningDate) : null,
                        comment: $("#leave-comment").val() || null
                    };
                }

                function isHoliday(date) {
                    return fetch(`/api/v1/ph-holiday/is-holiday?date=${encodeURIComponent(date)}`)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error: ${response.status}`);
                            }
                            return response.json();
                        })
                        .catch(error => {
                            console.error('Failed to check holiday:', error);
                            return false;
                        });
                }

                function getAvailableLeaveBalance(employeeId, leaveType) {
                    fetch(`/api/v1/leave-request/available-leave-balance?employeeId=${encodeURIComponent(employeeId)}&leaveType=${encodeURIComponent(leaveType)}`, {
                        method: "POST"
                    })
                        .then(function(response) {
                            if (!response.ok) {
                                throw new Error("Failed to get available leave balance.");
                            }

                            return response.json();
                        })
                        .then(function(balance) {
                            console.log("Available leave balance:", balance);
                            $("#available-balance").val(balance);
                        })
                        .catch(function(error) {
                            console.error("Error getting available leave balance:", error);
                            $("#available-balance").val("");
                        });
                }

                function saveLeaveRequest(request) {

                    fetch('/api/v1/leave-request/save-leave-request', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(request)
                    })
                        .then(function(response) {
                            return response.json().then(function(result) {
                                if (!response.ok) {
                                    throw new Error(result.message || 'Failed to save leave request.');
                                }
                                return result;
                            });
                        })
                        .then(function(result) {
                            console.log('Leave request saved:', result);
                            showSuccessThenRedirectPopup(
                                "Success",
                                result.returnMessage,
                                () => {
                                    window.location.reload();
                                }
                            );
                        })
                        .catch(function(error) {
                            console.error('Error saving leave request:', error);
                            showErrorPopup("Error", "Error saving leave request.");
                        });
                }
            });
        </script>
    </body>
</html>

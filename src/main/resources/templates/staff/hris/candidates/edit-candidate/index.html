<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title>Edit Candidate - Little Leaps Learning Center</title>
        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-css :: staff-common-css}"></th:block>
        <link th:href="@{/css/staff/lllc-default-styles.css}" rel="stylesheet" type="text/css">
        <link th:href="@{/css/components/default-add-view-edit-module.css}" rel="stylesheet" type="text/css">
        <link th:href="@{/css/staff/hris/candidates/add-candidate/lllc-staff-hris-add-candidate-styles.css}" rel="stylesheet" type="text/css">
    </head>
    <body class="container-fluid p-0" id="page-top">
        <div id="wrapper">
            <!-- Sidebar - Start -->
            <th:block th:insert="~{fragments/staff/common/html-fragment-staff-sidebar :: staff-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - End -->

            <div id="content-wrapper" class="d-flex flex-column">
                <div id="content">

                    <!-- Main Navigation Bar - Start -->
                    <th:block th:insert="~{fragments/staff/common/html-fragment-staff-main-navbar :: staff-common-main-navbar}"></th:block>
                    <!-- Main Navigation Bar - End -->

                    <div class="container-fluid">

                        <!-- Page Heading and Breadcrumbs - Start -->
                        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-breadcrumbs-no-greetings :: staff-breadcrumb-section(${pageTitle}, ${breadcrumbs})}"></th:block>
                        <!-- Page Heading and Breadcrumbs - End -->

                        <!-- Edit Candidate - Start -->
                        <th:block th:insert="~{fragments/staff/hris/candidates/edit-candidate/html-fragment-staff-edit-candidate :: staff-edit-candidate(${applicant})}"></th:block>
                        <!-- Edit Candidate - End -->
                    </div>
                </div>

                <!-- Footer - Start -->
                <th:block th:insert="~{fragments/staff/common/html-fragment-staff-footer :: staff-common-footer}"></th:block>
                <!-- Footer - End -->
            </div>
        </div>

        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-js :: staff-common-js}"></th:block>
<!--        <script th:src="@{/js/staff/management/registry/add-employee/lllc-staff-admin-add-employee-scripts.js}" type="text/javascript"></script>-->
    <script>
        $(document).ready(function () {
            initializeDatePicker("#candidate-applied-date", "mm/dd/yyyy");

            initializeDocumentUpload();

            $("#update-candidate-btn").on("click", function () {

                if (!validateForm()) {
                    return;
                }

                const request = buildApplicantRequest();

                console.log(request);
                updateCandidate(request);
            });

            function buildApplicantRequest() {
                return {
                    id: $('#applicantId').val(),
                    firstName: $("#candidate-firstname").val().trim(),
                    middleName: $("#candidate-middlename").val().trim(),
                    lastName: $("#candidate-lastname").val().trim(),
                    suffix: $("#candidate-suffix").val().trim(),
                    email: $("#candidate-email").val().trim(),
                    phoneNumber: $("#candidate-phone").val().trim(),
                    appliedJob: $("#candidate-applied-job").val(),
                    location: $("#candidate-location").val().trim(),
                    experience: $("#candidate-experience").val()
                        ? Number($("#candidate-experience").val())
                        : null,
                    appliedDate: $("#candidate-applied-date").val() || null,
                    appliedStage: "APPLIED",
                    resumeLink: uploadRequest?.secure_url
                        ?? ($('#existingResumeLink').val() || null),
                    resumeFilename: uploadRequest?.original_filename
                        ?? ($('#existingResumeFilename').val() || null),
                    notes: $("#candidate-notes").val().trim()
                };
            }

            $("#back-client-btn").on("click", function (e) {
                e.preventDefault();
                showConfirmPopup(
                    "Leave this page?",
                    "Your unsaved candidate data will be lost.",
                    () => window.location.href = $(this).data("url")
                );
            });

            function validateForm() {
                const form = $("#add-candidate-form")[0];
                let valid = form.checkValidity();

                const dateInput = $("#candidate-applied-date")[0];
                const date = dateInput.value.trim();
                const match = date.match(/^(\d{4})-(\d{2})-(\d{2})$/);

                let validDate = false;

                if (match) {
                    const [, yyyy, mm, dd] = match;
                    const parsedDate = new Date(+yyyy, +mm - 1, +dd);

                    validDate = parsedDate.getFullYear() === +yyyy
                        && parsedDate.getMonth() === +mm - 1
                        && parsedDate.getDate() === +dd;
                }

                dateInput.setCustomValidity(!date ? "Required" : validDate
                    ? "" : "Please select a valid applied date."
                );

                $(dateInput).next(".form-control")
                    .toggleClass("is-invalid", !validDate);

                if (!validDate) {
                    valid = false;
                }

                form.classList.add("was-validated");

                if (!valid) {
                    form.reportValidity();
                    return false;
                }

                return true;
            }

            function updateCandidate(request) {

                $.ajax({
                    url: "/api/v1/recruitment/update-candidate",
                    type: "PUT",
                    contentType: "application/json",
                    data: JSON.stringify(request),

                    success: function (response) {
                        console.log("Candidate updated successfully.", response);
                        showSuccessThenRedirectPopup(
                            "Success",
                            response.returnMessage,
                            () => {
                                window.location.href = "/app/portal/hr-recruitment/candidates";
                            }
                        );
                    },

                    error: function (xhr) {
                        console.error("Failed to update candidate.", xhr.responseJSON);
                        let message = "Unable to update candidate.";

                        if (xhr.responseJSON && xhr.responseJSON.message) {
                            message = xhr.responseJSON.message;
                        }

                        showErrorPopup("Error", message);
                    }
                });
            }
        });
    </script>
    </body>
</html>

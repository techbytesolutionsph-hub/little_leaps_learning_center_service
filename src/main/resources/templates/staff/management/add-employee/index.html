<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title>Add Staff - Little Leaps Learning Center</title>
        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-css :: staff-common-css}"></th:block>
        <link th:href="@{/css/staff/lllc-default-styles.css}" rel="stylesheet" type="text/css">
        <style>
            /* Show entries label */
            .dataTables_wrapper .dataTables_length,
            .dataTables_wrapper .dataTables_length label {
                font-family: 'Nunito', sans-serif !important;
                font-size: 12px !important;
                font-weight: 700 !important;
                color: #858796 !important;
            }

            /* Show entries dropdown */
            .dataTables_wrapper .dataTables_length select {
                font-family: 'Nunito', sans-serif !important;
                font-size: 12px !important;
                font-weight: 700 !important;
                color: #858796 !important;
            }

            /* Search label */
            .dataTables_wrapper .dataTables_filter,
            .dataTables_wrapper .dataTables_filter label {
                font-family: 'Nunito', sans-serif !important;
                font-size: 12px !important;
                font-weight: 700 !important;
                color: #858796 !important;
            }

            /* Search input */
            .dataTables_wrapper .dataTables_filter input {
                font-family: 'Nunito', sans-serif !important;
                font-size: 12px !important;
                font-weight: 500 !important;
                color: #858796 !important;
            }
        </style>
    </head>
    <body class="container-fluid p-0" id="page-top">
        <div id="wrapper">
            <!-- Sidebar - Start -->
            <th:block th:insert="~{fragments/staff/common/html-fragment-staff-sidebar :: staff-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - End -->

            <div id="content-wrapper" class="d-flex flex-column">
                <div id="content">

                    <!-- Main Navigation Bar - Start -->
                    <th:block th:insert="~{fragments/staff/common/html-fragment-staff-main-navbar :: staff-common-main-navbar}"></th:block>
                    <!-- Main Navigation Bar - End -->

                    <div class="container-fluid">

                        <!-- Page Heading and Breadcrumbs - Start -->
                        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-breadcrumbs :: staff-breadcrumb-section(${pageTitle}, ${breadcrumbs})}"></th:block>
                        <!-- Page Heading and Breadcrumbs - End -->

                        <!-- Client Management Main - Start -->
                        <th:block th:insert="~{fragments/staff/management/employee-management/html-fragment-staff-employee-management :: staff-add-employee}"></th:block>
                        <!-- Client Management Main - End -->
                    </div>
                </div>

                <!-- Footer - Start -->
                <th:block th:insert="~{fragments/staff/common/html-fragment-staff-footer :: staff-common-footer}"></th:block>
                <!-- Footer - End -->
            </div>
        </div>

        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-js :: staff-common-js}"></th:block>
<!--        <script th:src="@{/js/staff/dashboard/lllc-staff-dashboard-scripts.js}" type="text/javascript"></script>-->
    </body>
</html>

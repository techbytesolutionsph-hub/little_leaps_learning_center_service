<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <th:block th:insert="~{fragments/common/html-fragment-default-meta :: meta}"></th:block>
        <title>Client Management- Little Leaps Learning Center</title>
        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-css :: staff-common-css}"></th:block>
        <link th:href="@{/css/staff/lllc-default-styles.css}" rel="stylesheet" type="text/css">
        <style>
            .row.no-equal-height {
                align-items: flex-start;
            }

            /* Flatpickr input */
            #client-birth-date,
            #client-date-enrolled {
                font-family: 'Poppins', sans-serif;
                font-size: 12px;
                background-color: #fff;
                border: 1px solid #d3cece;
                border-radius: 8px;
                height: 30px;
            }

            /* Focus */
            #client-birth-date:focus,
            #client-date-enrolled:focus {
                border-color: rgb(176, 220, 222);
                box-shadow: 0 0 0 0.1rem rgb(176, 220, 222);
            }

            #client-birth-date::placeholder,
            #client-date-enrolled::placeholder {
                font-size: 12px !important;
            }

            .birthdate-input {
                font-size: 12px !important;
                /*font-family: 'Poppins', sans-serif;*/
                background-color: #fff !important;
            }

            .date-enrolled-input {
                font-size: 12px !important;
                /*font-family: 'Poppins', sans-serif;*/
                background-color: #fff !important;
            }

            .date-input-wrapper {
                position: relative;
                z-index: 10;
                width: 100%;
            }

            .date-input-wrapper input {
                padding-right: 42px;
            }

            /* icon positioning */
            .calendar-icon {
                position: absolute;
                right: 12px;
                top: 50%;
                transform: translateY(-50%);
                color: rgb(0, 151, 157);
                font-size: 12px !important;
                pointer-events: none;
            }

            /* Calendar popup size */
            .flatpickr-calendar {
                min-width: 260px;
                width: auto;
                font-size: 12px !important;
                z-index: 9999 !important;
            }

            /* Flatpickr visible input */
            .flatpickr-input {
                font-family: 'Poppins', sans-serif;
                font-size: 12px !important;
                background-color: #fff !important;
                border: 1px solid #d3cece;
                border-radius: 8px;
                height: 30px;
                appearance: none;
                -webkit-appearance: none;
            }

            .flatpickr-input::placeholder {
                font-size: 12px !important;
            }

            .flatpickr-input::-webkit-calendar-picker-indicator {
                display: none;
            }

            /* Increase height spacing */
            .flatpickr-days {
                padding: 8px;
            }

            /* Calendar theme override */
            .flatpickr-day.selected,
            .flatpickr-day.startRange,
            .flatpickr-day.endRange {
                background: rgb(0, 151, 157);
                border-color: rgb(0, 151, 157);
            }

            .flatpickr-day:hover {
                background: rgb(176, 220, 222);
            }

            /* Hide browser native date icon */
            #client-birth-date::-webkit-calendar-picker-indicator {
                display: none;
                -webkit-appearance: none;
            }

            #client-birth-date {
                appearance: none;
                -webkit-appearance: none;
            }



            /* Container for image upload */
            .color-upload-wrapper {
                border: 2px dashed #ccc;
                border-radius: 6px;
                padding: 10px;
                text-align: center;
                transition: border-color 0.3s ease;
            }

            .color-upload-wrapper:hover {
                border-color: #999;
            }

            /* Image preview styling */
            #color-image-preview {
                max-width: 100%;
                max-height: 120px;
                margin-top: 10px;
                object-fit: contain;
                border-radius: 4px;
                display: block;
                margin-left: auto;
                margin-right: auto;
            }

            .image-preview {
                width: 100%;
                height: 250px;
                object-fit: contain;
                border-radius: 6px;
                background-color: #f8f9fc;
                border: 1px solid #ddd;
                padding: 5px;
                display: none;
            }

            input[type="file"] {
                font-size: 0.8rem;
            }

            .custom-file-upload {
                padding: 8px 16px;
                cursor: pointer;
                background-color: rgb(0, 151, 157);
                color: #fff;
                font-weight: bold;
                border-radius: 6px;
                width: 100%;
                height: 35px;
                font-size: 0.8rem;
                transition: background-color 0.3s ease;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .custom-file-upload:hover {
                background-color: rgb(0, 151, 157);
            }

            input[type="file"].hidden-upload {
                display: none;
            }

            #add-client-btn {
                width: clamp(90px, 10vw, 140px);
                height: clamp(32px, 4vh, 40px);
                font-size: clamp(10px, 1.2vw, 12px);
                font-weight: 700;
                padding: 0;
                margin: 2px;
                border-radius: 6px;
                transition: background 0.3s ease, color 0.3s ease;
                box-shadow: 0 10px 24px rgba(0, 151, 157, .28);
                background: linear-gradient(135deg, #00A8AE, #007E83);
                border-color: #007E83;
                color: #fff;
            }

            #add-client-btn:hover {
                background-color: #fff !important;
                border-color: rgb(0, 151, 157);
                transform: translateY(-1px);
                box-shadow: 0 4px 8px rgba(0, 90, 95, 0.25);
            }
        </style>
    </head>
    <body class="container-fluid p-0" id="page-top">
        <div id="wrapper">
            <!-- Sidebar - Start -->
            <th:block th:insert="~{fragments/staff/common/html-fragment-staff-sidebar :: staff-common-sidebar(${nav})}"></th:block>
            <!-- Sidebar - End -->

            <div id="content-wrapper" class="d-flex flex-column">
                <div id="content">

                    <!-- Main Navigation Bar - Start -->
                    <th:block th:insert="~{fragments/staff/common/html-fragment-staff-main-navbar :: staff-common-main-navbar}"></th:block>
                    <!-- Main Navigation Bar - End -->

                    <div class="container-fluid">

                        <!-- Page Heading and Breadcrumbs - Start -->
                        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-breadcrumbs-no-greetings :: staff-breadcrumb-section(${pageTitle}, ${breadcrumbs})}"></th:block>
                        <!-- Page Heading and Breadcrumbs - End -->

                        <!-- Add Client - Start -->
                        <th:block th:insert="~{fragments/staff/clients/add/html-fragment-staff-add-client :: staff-add-client}"></th:block>
                        <!-- Add Client - End -->
                    </div>
                </div>

                <!-- Footer - Start -->
                <th:block th:insert="~{fragments/staff/common/html-fragment-staff-footer :: staff-common-footer}"></th:block>
                <!-- Footer - End -->
            </div>
        </div>

        <th:block th:insert="~{fragments/staff/common/html-fragment-staff-common-js :: staff-common-js}"></th:block>
<!--        <script th:src="@{/js/staff/dashboard/lllc-staff-dashboard-scripts.js}" type="text/javascript"></script>-->
    <script>
        $(document).ready(function () {
            flatpickr("#client-birth-date", {
                enableTime: false,
                altInput: true,
                altFormat: "Y-m-d",
                dateFormat: "Y-m-d",
                maxDate: "today",
                altInputClass: "form-control text-sm birthdate-input",
                onReady: function(selectedDates, dateStr, instance) {
                    instance.altInput.setAttribute("placeholder", "Select birth date");
                },
                position: "auto"
            });

            flatpickr("#client-date-enrolled", {
                enableTime: false,
                altInput: true,
                altFormat: "Y-m-d",
                dateFormat: "Y-m-d",
                maxDate: "today",
                altInputClass: "form-control text-sm date-enrolled-input",
                onReady: function(selectedDates, dateStr, instance) {
                    instance.altInput.setAttribute("placeholder", "Select birth date");
                },
                position: "auto"
            });


            /* Image Upload Preview */
            $(document).on('change', '.image-upload', async function (event) {

                const file = event.target.files[0];

                const $wrapper = $(this)
                    .closest('.mb-4')
                    .find('.color-upload-wrapper');

                const $img = $wrapper.find('.image-preview');

                $img.hide();
                $wrapper.find('.remove-image').remove();

                if (!file) return;

                if (!file.type.startsWith('image/')) {
                    alert('Please select a valid image file.');
                    $(this).val('');
                    return;
                }

                const url = await uploadToCloudinary(file);

                if (url) {
                    $img.attr('src', url).show();

                    const $removeBtn = $(`
                <button type="button"
                    class="remove-image btn btn-sm btn-danger position-absolute d-flex justify-content-center align-items-center"
                    style="top:8px; right:8px; width:28px; height:28px; border-radius:50%;">
                    &times;
                </button>
            `);

                    $wrapper.css('position', 'relative').append($removeBtn);
                }
            });

            /* Remove image */
            $(document).on('click', '.remove-image', function () {
                const $wrapper = $(this).closest('.color-upload-wrapper');
                $wrapper.find('.image-preview').attr('src', '').hide();
                $wrapper.siblings('.custom-file-upload').find('.image-upload').val('');
                $(this).remove();
            });

            /* Cloudinary upload function */
            async function uploadToCloudinary(file) {
                const formData = new FormData();
                formData.append("file", file);
                formData.append("upload_preset", "telatak");

                try {
                    const res = await fetch("https://api.cloudinary.com/v1_1/dx8es7rbm/image/upload", {
                        method: "POST",
                        body: formData
                    });
                    const data = await res.json();
                    return data.secure_url;
                } catch (err) {
                    console.error("Cloudinary upload error:", err);
                    alert("Upload failed. Try again.");
                    return null;
                }
            }

            $('#back-btn').on('click', function (e) {
                e.preventDefault();

                const url = $(this).data('url');
                console.log(url);

                showConfirmPopup(
                    'Leave this page?',
                    'Your unsaved product data will be lost.',
                    function () {
                        window.location.href = url;
                    }
                );
            });
        });
    </script>
    </body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <div th:fragment="staff-admin-view-user(user)">
        <!-- View User Account - START -->
        <form id="view-client-form" autocomplete="off" class="needs-validation">
            <div class="client-form-layout">
                <div class="client-form-main">
                    <section class="client-section-card mb-2">
                        <div class="client-section-header">
                            <div class="section-number">1</div>
                            <div class="section-header-content">
                                <h3>User Account Information</h3>
                                <p>Enter the user's account credentials, email address, role, and status.</p>
                            </div>
                        </div>
                        <div class="client-section-body">
                            <div class="row px-2">
                                <div class="col-12 col-md-6 mt-2 mb-2">
                                    <label for="user-username" class="form-label text-sm fw-bold text-gray-700">Username</label>
                                    <input type="text"
                                           class="form-control text-sm variation-sku"
                                           id="user-username"
                                           placeholder="Enter username"
                                           th:value="${user.username}"
                                           disabled required>
                                    <div class="invalid-feedback">
                                        Please enter a username.
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mt-2 mb-2">
                                    <label for="user-password" class="form-label text-sm fw-bold text-gray-700">
                                        Password
                                    </label>

                                    <div class="input-group">
                                        <input type="password" class="form-control text-sm" id="user-password" placeholder="Click Generate" th:value="${user.lastPassword}" disabled required>

                                        <button class="btn btn-outline-primary"
                                                type="button"
                                                id="generate-password-btn" disabled>
                                            <i class="bi bi-arrow-repeat"></i>
                                        </button>
                                    </div>
                                    <div class="invalid-feedback">
                                        Please generate a password.
                                    </div>
                                </div>
                            </div>
                            <div class="row px-2">
                                <div class="col-12 col-md-6 mt-2 mb-2">
                                    <label for="user-email" class="form-label text-sm fw-bold text-gray-700">Email</label>
                                    <input type="email"
                                           class="form-control text-sm variation-sku"
                                           id="user-email"
                                           placeholder="Enter user email"
                                           th:value="${user.email}"
                                           disabled required>
                                    <div class="invalid-feedback">
                                        Please enter a valid email address.
                                    </div>
                                </div>
                                <div class="col-12 col-md-6 mt-2 mb-2">
                                    <label for="user-role" class="form-label text-sm fw-bold text-gray-800">User Role</label>
                                    <select class="form-control text-sm" id="user-role" disabled required>
                                        <option value="" selected disabled>Select a role</option>
                                        <option value="SUPER_ADMIN"
                                                th:selected="${user.role.name() == 'SUPER_ADMIN'}">
                                            Super Admin
                                        </option>
                                        <option value="CHIEF_OPERATING_OFFICER"
                                                th:selected="${user.role.name() == 'CHIEF_OPERATING_OFFICER'}">
                                            Chief Operating Officer
                                        </option>
                                        <option value="IT_ADMINISTRATOR"
                                                th:selected="${user.role.name() == 'IT_ADMINISTRATOR'}">
                                            IT Administrator
                                        </option>
                                        <option value="HUMAN_RESOURCE_MANAGER"
                                                th:selected="${user.role.name() == 'HUMAN_RESOURCE_MANAGER'}">
                                            Human Resource Manager
                                        </option>
                                        <option value="SECRETARY"
                                                th:selected="${user.role.name() == 'SECRETARY'}">
                                            Secretary
                                        </option>
                                        <option value="ACCOUNTING_OFFICER"
                                                th:selected="${user.role.name() == 'ACCOUNTING_OFFICER'}">
                                            Accounting Officer
                                        </option>
                                        <option value="BEHAVIORAL_THERAPIST"
                                                th:selected="${user.role.name() == 'BEHAVIORAL_THERAPIST'}">
                                            Behavioral Therapist
                                        </option>
                                        <option value="CASE_MANAGER"
                                                th:selected="${user.role.name() == 'CASE_MANAGER'}">
                                            Case Manager
                                        </option>
                                        <option value="MAINTENANCE_STAFF"
                                                th:selected="${user.role.name() == 'MAINTENANCE_STAFF'}">
                                            Maintenance Staff
                                        </option>
                                        <option value="PSYCHOLOGIST"
                                                th:selected="${user.role.name() == 'PSYCHOLOGIST'}">
                                            Psychologist
                                        </option>
                                        <option value="SPEECH_LANGUAGE_PATHOLOGIST"
                                                th:selected="${user.role.name() == 'SPEECH_LANGUAGE_PATHOLOGIST'}">
                                            Speech-Language Pathologist
                                        </option>
                                        <option value="OCCUPATIONAL_THERAPIST"
                                                th:selected="${user.role.name() == 'OCCUPATIONAL_THERAPIST'}">
                                            Occupational Therapist
                                        </option>
                                        <option value="PARENT"
                                                th:selected="${user.role.name() == 'PARENT'}">
                                            Parent
                                        </option>
                                        <option value="KID"
                                                th:selected="${user.role.name() == 'KID'}">
                                            Kid
                                        </option>
                                    </select>
                                    <div class="invalid-feedback">
                                        Please select a user role.
                                    </div>
                                </div>
                            </div>
                            <div class="row px-2">
                                <div class="col-12 col-md-6 mt-2 mb-2">
                                    <label for="user-status" class="form-label text-sm fw-bold text-gray-800">Status</label>
                                    <select class="form-control text-sm" id="user-status" disabled required>
                                        <option value="" selected disabled>Select a role</option>
                                        <option value="ACTIVE"
                                                th:selected="${user.status.name() == 'ACTIVE'}">
                                            Active
                                        </option>
                                        <option value="INACTIVE"
                                                th:selected="${user.status.name() == 'INACTIVE'}">
                                            Inactive
                                        </option>
                                        <option value="SUSPENDED"
                                                th:selected="${user.status.name() == 'SUSPENDED'}">
                                            Suspended
                                        </option>
                                        <option value="DISABLED"
                                                th:selected="${user.status.name() == 'DISABLED'}">
                                            Disabled
                                        </option>
                                    </select>
                                    <div class="invalid-feedback">
                                        Please select a status.
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>
                </div>

                <div class="client-form-side">
                    <section class="client-photo-card mb-4">
                        <div class="client-photo-header">
                            <h3>User Photo</h3>
                            <p>Upload a user profile photo.</p>
                        </div>

                        <div class="client-photo-body">
                            <div id="photoDropZone" class="photo-drop-zone">
                                <img id="clientPhotoPreview"
                                     class="client-photo-preview"
                                     th:src="${user.profileImageUrl}"
                                     alt="Client photo preview"
                                     th:style="${user.profileImageUrl != null ? 'display:block;' : 'display:none;'}">
                                <input type="file" id="clientPhoto" name="profileImage" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <div class="client-section-footer mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <button type="button" class="btn btn-back fw-semibold" id="back-client-btn" onclick="history.back()">
                        <i class="fa-solid fa-arrow-left mr-2"></i>
                        Back
                    </button>
                </div>
            </div>
        </form>
        <!-- View User Account - END -->
    </div>
</html>

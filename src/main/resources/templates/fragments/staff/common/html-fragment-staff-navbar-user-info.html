<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

    <div th:fragment="staff-common-navbar-user-info">
        <!-- Nav Item - User Information - Start -->
        <li class="nav-item dropdown no-arrow">
            <a class="nav-link dropdown-toggle" href="#" id="userDropdown" role="button"
               data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                <div sec:authorize="isAuthenticated()">
                    <span class="mr-2 d-none d-lg-inline text-gray-600 small font-weight-bold" sec:authentication="principal.staffFirstName"></span>
                </div>
                <img class="img-profile rounded-circle" th:src="@{${#authentication.principal.profileImageUrl}}" />
            </a>
            <!-- Dropdown - User Information -->
            <div class="dropdown-menu dropdown-menu-right shadow animated--grow-in"
                 aria-labelledby="userDropdown">
                <a class="dropdown-item" th:href="@{/app/portal/profile/seller-profile}">
                    <i class="fas fa-user fa-sm fa-fw mr-2 text-gray-400"></i>
                    Profile
                </a>
                <a class="dropdown-item" th:href="@{/app/portal/settings}">
                    <i class="fas fa-cogs fa-sm fa-fw mr-2 text-gray-400"></i>
                    Settings
                </a>
                <a class="dropdown-item" th:href="@{/app/portal/activity-logs}">
                    <i class="fas fa-list fa-sm fa-fw mr-2 text-gray-400"></i>
                    Activity Log
                </a>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item" href="#" data-toggle="modal" data-target="#logoutModal">
                    <i class="fas fa-sign-out-alt fa-sm fa-fw mr-2 text-gray-400"></i>
                    Logout
                </a>
            </div>
        </li>
        <!-- Nav Item - User Information - End -->

        <!-- Logout Modal-->
        <div class="modal fade" id="logoutModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel"
             aria-hidden="true">
            <div class="modal-dialog" role="document">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="exampleModalLabel">Confirm Logout</h5>
                        <button class="close logout-close-btn" type="button" data-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">×</span>
                        </button>
                    </div>
                    <div class="modal-body">End your session? Click <strong>Logout</strong> to continue.</div>
                    <div class="modal-footer">
                        <button class="btn btn-cancel text-sm" type="button" data-dismiss="modal">
                            <i class="bi bi-x-circle-fill text-m font-bold mr-1"></i>
                            Cancel
                        </button>
                        <a class="btn btn-logout text-sm" data-dismiss="modal" id="staff-sign-out-page">
                            <i class="bi bi-box-arrow-right text-m font-bold mr-1"></i>
                            Logout
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>

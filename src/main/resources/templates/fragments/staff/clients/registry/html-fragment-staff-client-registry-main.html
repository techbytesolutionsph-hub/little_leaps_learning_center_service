<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <div th:fragment="staff-client-registry-main(clients)">
        <!-- Client Management - START -->
        <section class="default-card css-default-card">
            <div class="css-default-card-header mb-2">
                <div class="section-title">
                    <div class="section-title-icon">
                        <i class="fa-solid fa-child-reaching"></i>
                    </div>
                    <div>
                        <h2>Client Registry</h2>
                        <p>View, manage, and review client records.</p>
                    </div>
                </div>

                <a th:href="@{/app/portal/client-management/registry/add-client}"
                   class="btn-glossy-teal-header d-flex justify-content-center align-items-center"
                   id="add-client-btn" style="text-decoration: none">
                    <i class="fa-solid fa-user-plus mr-2"></i> Add Client
                </a>
            </div>
            <div class="reports-table-wrapper">
                <div class="table-responsive">
                    <table class="table table-bordered" id="clientTable">
                        <thead>
                            <tr>
                                <th>Client ID</th>
                                <th>Client Info</th>
                                <th>Date Enrolled</th>
                                <th>Guardian/Parent Name</th>
                                <th>Diagnosis</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="client : ${clients}">
                                <td data-label="ID" th:text="${client.clientId}"></td>
                                <td data-label="Client Info">
                                    <div class="d-flex align-items-center">
                                        <!-- Profile Image -->
                                        <img th:src="${client.profileImageUrl != null ? client.profileImageUrl : '/images/default-profile.png'}"
                                             class="rounded-circle me-2"
                                             style="width:45px;height:45px;object-fit:cover;"
                                             alt="Profile">

                                        <!-- Employee Details -->
                                        <div>
                                            <div class="fw-bold text-dark"
                                                 th:text="${client.firstName + ' ' + client.lastName}">
                                                Maria Santos
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${client.parents[0].email}">
                                                maria.santos@littleleaps.com
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${client.parents[0].contactNumber}">
                                                0917-123-4567
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td data-label="Date Enrolled" th:text="${client.dateEnrolled}"></td>
                                <td data-label="Guardian/Parent Name" th:text="${client.parents[0].firstName + ' ' + client.parents[0].lastName}"></td>
                                <td data-label="Diagnosis">
                                    <span th:each="diagnosis : ${client.diagnosisConcerns}"
                                          th:text="${diagnosis.displayName}"
                                          style="display: block;">
                                    </span>
                                </td>
                                <td data-label="Status">
                                    <span class="status-badge badge-active"
                                          th:if="${client.enrollmentStatus != null and client.enrollmentStatus.name() == 'ENROLLED'}">
                                        <i class="bi bi-check-circle-fill mr-1"></i> Enrolled
                                    </span>

                                    <span class="status-badge badge-danger"
                                      th:if="${client.enrollmentStatus != null and client.enrollmentStatus.name() == 'CANCELLED'}">
                                        <i class="bi bi-pause-circle-fill mr-1"></i> Cancelled
                                    </span>
                                </td>
                                <td data-label="Actions" >
                                    <div class="actions-buttons d-flex flex-wrap justify-content-start gap-1">
                                        <a th:href="@{|/app/portal/client-management/registry/view-client?id=${client.clientId}|}"
                                           class="btn-glossy-teal action-btn d-flex align-items-center" data-tooltip="View Client">
                                            <i class="bi bi-eye"></i>
                                        </a>
                                        <a th:href="@{|/app/portal/client-management/registry/edit-client?id=${client.clientId}|}"
                                           class="btn-glossy-teal action-btn d-flex align-items-center" data-tooltip="Edit Client">
                                            <i class="bi bi-pen"></i>
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
        <!-- Client Management - END -->
    </div>
</html>

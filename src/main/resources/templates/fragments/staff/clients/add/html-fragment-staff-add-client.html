<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <div th:fragment="staff-add-client">
        <!-- Add Client - START -->
        <form id="add-client-form" autocomplete="off" class="needs-validation">
            <div class="card shadow mb-4">
                <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                    <h6 class="m-0 font-weight-bold">
                        <i class="fa-solid fa-user mr-2"></i> New Client
                    </h6>
                    <button type="button"
                            class="btn-glossy-teal d-flex justify-content-center align-items-center"
                            id="back-btn"
                            data-url="/app/portal/client-management">
                        <i class="bi bi-arrow-return-left mr-2"></i> Back
                    </button>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-lg-8">
                            <div class="card shadow mt-lg-1 mb-lg-1">
                                <div class="card-header-white py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h5 class="m-0 text-sm font-weight-bold text-gray-800">
                                        Client Information
                                    </h5>
                                </div>
                                <div class="card-body-white mt-lg-1 mb-lg-1">
                                    <div class="row px-2">
                                        <div class="col-12 col-md-5 mt-2 mb-2">
                                            <label for="client-firstname" class="form-label text-sm fw-bold text-gray-700">First name</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-firstname" placeholder="Enter first name" required>
                                        </div>
                                        <div class="col-12 col-md-2 mt-2 mb-2">
                                            <label for="client-middlename" class="form-label text-sm fw-bold text-gray-700">M.I.</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-middlename" placeholder="M.I." required>
                                        </div>
                                        <div class="col-12 col-md-5 mt-2 mb-2">
                                            <label for="client-lastname" class="form-label text-sm fw-bold text-gray-700">Last name</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-lastname" placeholder="Enter last name" required>
                                        </div>
                                    </div>
                                    <div class="row px-2">
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-age" class="form-label text-sm fw-bold text-gray-700">Age</label>
                                            <input type="number" class="form-control text-sm variation-sku" id="client-age" placeholder="Enter age" required>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-birth-date" class="text-sm fw-bold text-gray-700">Birthdate</label>
                                            <div class="date-input-wrapper">
                                                <input type="text" id="client-birth-date" class="form-control" placeholder="Select birthdate">
                                                <i class="bi bi-calendar-event calendar-icon"></i>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-gender" class="form-label text-sm fw-bold text-gray-800">Gender</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-gender" required>
                                                <option value="">Select a gender</option>
                                                <option value="MALE">Male</option>
                                                <option value="FEMALE">Female</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card shadow mt-lg-1 mb-lg-1">
                                <div class="card-header-white py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h5 class="m-0 text-sm font-weight-bold text-gray-800">
                                        Client Enrollment Details
                                    </h5>
                                </div>
                                <div class="card-body-white">
                                    <div class="row px-2">
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-diagnosis" class="form-label text-sm fw-bold text-gray-800">Diagnosis/Concern</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-diagnosis" required>
                                                <option value="">Select a diagnosis</option>
                                                <option value="SPEECH_DELAY">Speech Delay</option>
                                                <option value="BEHAVIORAL_CONCERN">Behavioral Concern</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-birth-date" class="text-sm fw-bold text-gray-700">Enrollment Date</label>
                                            <div class="date-input-wrapper">
                                                <input type="text" id="client-date-enrolled" class="form-control" placeholder="Select enrollment date">
                                                <i class="bi bi-calendar-event calendar-icon"></i>
                                            </div>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-program-type" class="form-label text-sm fw-bold text-gray-800">Program Type</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-program-type" required>
                                                <option value="">Select program type</option>
                                                <option value="ABA">ABA</option>
                                                <option value="BEHAVIORAL_CONCERN">Behavioral Concern</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-assign-branch" class="form-label text-sm fw-bold text-gray-800">Branch</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-assign-branch" required>
                                                <option value="">Select a branch</option>
                                                <option value="SAN_JUAN">San Juan, Batangas</option>
                                                <option value="CATANAUAN">Catanauan, Quezon</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-case-manager" class="form-label text-sm fw-bold text-gray-800">Case Manager</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-case-manager" required>
                                                <option value="">Select case manager</option>
                                                <option value="CASE_MGR_1">Andrie Alcantara</option>
                                                <option value="CASE_MGR_2">Cyril Joy Morante</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-therapist" class="form-label text-sm fw-bold text-gray-800">Assigned Therapist</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-therapist" required>
                                                <option value="">Select therapist</option>
                                                <option value="THERAPIST_1">Andrie Alcantara</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-enrollment-status" class="form-label text-sm fw-bold text-gray-800">Enrollment Status</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-enrollment-status" required>
                                                <option value="">Select a status</option>
                                                <option value="ENROLLED">Enrolled</option>
                                                <option value="CANCELLED">Cancelled</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="card shadow mt-lg-1 mb-lg-1">
                                <div class="card-header-white py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h5 class="m-0 text-sm font-weight-bold text-gray-800">
                                        Guardian/Parent Details
                                    </h5>
                                </div>
                                <div class="card-body-white">
                                    <div class="row px-2">
                                        <div class="col-12 col-md-5 mt-2 mb-2">
                                            <label for="client-parent-firstname" class="form-label text-sm fw-bold text-gray-700">First name</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-firstname" placeholder="Enter first name" required>
                                        </div>
                                        <div class="col-12 col-md-2 mt-2 mb-2">
                                            <label for="client-parent-middlename" class="form-label text-sm fw-bold text-gray-700">M.I.</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-middlename" placeholder="M.I." required>
                                        </div>
                                        <div class="col-12 col-md-5 mt-2 mb-2">
                                            <label for="client-parent-lastname" class="form-label text-sm fw-bold text-gray-700">Last name</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-lastname" placeholder="Enter last name" required>
                                        </div>
                                    </div>
                                    <div class="row px-2">
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-parent-email" class="form-label text-sm fw-bold text-gray-700">Email</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-email" placeholder="Enter email" required>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-parent-contact-no" class="form-label text-sm fw-bold text-gray-700">Contact No.</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-contact-no" placeholder="Enter contact number" required>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-parent-relationship" class="form-label text-sm fw-bold text-gray-800">Relationship to client</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-parent-relationship" required>
                                                <option value="">Select a relationship</option>
                                                <option value="PARENT">Parent</option>
                                                <option value="GUARDIAN">Guardian</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-6 mt-2 mb-2">
                                            <label for="client-parent-gender" class="form-label text-sm fw-bold text-gray-800">Gender</label>
                                            <select class="form-control text-sm variation-discount-type" id="client-parent-gender" required>
                                                <option value="">Select a gender</option>
                                                <option value="MALE">Male</option>
                                                <option value="FEMALE">Female</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-12 mt-2 mb-2">
                                            <label for="client-parent-address" class="form-label text-sm fw-bold text-gray-700">Complete Address</label>
                                            <input type="text" class="form-control text-sm variation-sku" id="client-parent-address" placeholder="Enter complete address" required>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-lg-4">
                            <div class="card shadow mt-lg-1 mb-lg-1">
                                <div class="card-header-white py-3 d-flex flex-row align-items-center justify-content-between">
                                    <h5 class="m-0 text-sm font-weight-bold text-gray-800">
                                        Client Photo
                                    </h5>
                                </div>
                                <div class="card-body-white">
                                    <div class="row px-2">
                                        <div class="col-12 col-md-12 mt-2 mb-2">
                                            <label class="form-label text-sm fw-bold text-gray-800">Upload Photo</label>

                                            <label class="custom-file-upload">
                                                <i class="bi bi-upload mr-2"></i>Choose File
                                                <input type="file" class="image-upload hidden-upload" accept="image/*">
                                            </label>

                                            <div class="mt-2 color-upload-wrapper">
                                                <div class="image-preview-container">
                                                    <img class="image-preview" src="" alt="Preview">
                                                </div>

                                                <small class="text-muted text-xs d-block mt-2">
                                                    Allowed formats: JPG, PNG. Max size: 1MB
                                                </small>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card-footer">
                    <div class="d-flex justify-content-end">
                        <button type="button" class="btn btn-secondary fw-semibold" id="add-client-btn">
                            <i class="fa-solid fa-user-plus mr-2"></i>
                            Add Client
                        </button>
                    </div>
                </div>
            </div>
        </form>
        <!-- Add Client - END -->
    </div>
</html>

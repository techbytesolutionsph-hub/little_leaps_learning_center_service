<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
    <div th:fragment="staff-client-assignment-main(assignments)">
        <!-- Client Management - START -->
        <div class="card shadow mb-4">
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold">
                    <img src="/img/lordicon/little-leap-kids-icon.svg" width="24" height="24" class="mr-2" alt="Homepage"> Client Assignment Records
                </h6>

                <a th:href="@{/app/portal/client-management/assignment/assign-client}"
                   class="btn-glossy-teal-header d-flex justify-content-center align-items-center"
                   id="add-client-btn" style="text-decoration: none">

                    <i class="fa-solid fa-user-plus mr-2"></i> New Assignment
                </a>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered" id="clientTable">
                        <thead>
                            <tr>
                                <th>Assignment ID</th>
                                <th>Client Info</th>
                                <th>Case Manager</th>
                                <th>Behavioral Therapist</th>
                                <th>Assign Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="assignment : ${assignments}">
                                <td data-label="ID" th:text="${assignment.assignmentId}"></td>
                                <td data-label="Client Info">
                                    <div class="d-flex align-items-center">
                                        <!-- Profile Image -->
                                        <img th:src="${assignment.clientProfilePicture != null ? assignment.clientProfilePicture : '/img/base/default-profile.png'}"
                                             class="rounded-circle me-2"
                                             style="width:45px;height:45px;object-fit:cover;"
                                             alt="Profile">

                                        <!-- Employee Details -->
                                        <div>
                                            <div class="fw-bold text-dark"
                                                 th:text="${assignment.clientFullName}">
                                                Maria Santos
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${assignment.guardianEmail}">
                                                maria.santos@littleleaps.com
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${assignment.guardianContactNo}">
                                                0917-123-4567
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td data-label="Case Manager">
                                    <div class="d-flex align-items-center">
                                        <!-- Profile Image -->
                                        <img th:src="${assignment.caseManagerProfilePicture != null ? assignment.caseManagerProfilePicture : '/img/base/default-profile.png'}"
                                             class="rounded-circle me-2"
                                             style="width:45px;height:45px;object-fit:cover;"
                                             alt="Profile">

                                        <!-- Employee Details -->
                                        <div>
                                            <div class="fw-bold text-dark"
                                                 th:text="${assignment.caseManagerFullName}">
                                                Maria Santos
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${assignment.caseManagerPosition}">
                                                Case Manager
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td data-label="Behavioral Therapist">
                                    <div class="d-flex align-items-center">
                                        <!-- Profile Image -->
                                        <img th:src="${assignment.behavioralTherapistProfilePicture != null ? assignment.behavioralTherapistProfilePicture : '/img/base/default-profile.png'}"
                                             class="rounded-circle me-2"
                                             style="width:45px;height:45px;object-fit:cover;"
                                             alt="Profile">

                                        <!-- Employee Details -->
                                        <div>
                                            <div class="fw-bold text-dark"
                                                 th:text="${assignment.behavioralTherapistFullName}">
                                                Maria Santos
                                            </div>

                                            <div class="text-muted small"
                                                 th:text="${assignment.behavioralTherapistPosition}">
                                                Case Manager
                                            </div>
                                        </div>
                                    </div>
                                </td>
                                <td data-label="Assign Status">
                                    <span class="status-badge badge-active"
                                          th:if="${assignment.status != null and assignment.status.name() == 'ACTIVE'}">
                                        <i class="bi bi-check-circle-fill mr-1"></i> Assigned
                                    </span>

                                    <span class="status-badge badge-danger"
                                          th:if="${assignment.status != null and assignment.status.name() == 'INACTIVE'}">
                                        <i class="bi bi-pause-circle-fill mr-1"></i> Unassigned
                                    </span>
                                </td>
                                <td data-label="Actions" >
                                    <div class="actions-buttons d-flex flex-wrap justify-content-start gap-1">
                                        <a th:if="${assignment.status != null and assignment.status.name() == 'ACTIVE'}"
                                           th:href="@{|/app/portal/client-management/assignment/view-assignment?id=${assignment.assignmentId}|}"
                                           class="btn-glossy-teal action-btn d-flex align-items-center">
                                            <i class="bi bi-eye mr-1"></i> View
                                        </a>

                                        <a th:if="${assignment.status != null and assignment.status.name() == 'ACTIVE'}"
                                           th:href="@{|/app/portal/client-management/assignment/edit-assignment?id=${assignment.assignmentId}|}"
                                           class="btn-glossy-teal action-btn d-flex align-items-center">
                                            <i class="bi bi-pen mr-1"></i> Edit
                                        </a>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Client Management - END -->
    </div>
</html>
